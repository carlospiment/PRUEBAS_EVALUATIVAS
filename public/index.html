<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluaciones de Agricultura | MEDUCA</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#15803d">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
</head>
<body data-page="home">
  <a href="#mainContent" class="skip-link visually-hidden">Ir al contenido principal</a>

  <main id="mainContent" class="container" style="max-width: 620px; padding: 36px 20px;" tabindex="-1">

    <!-- ENCABEZADO INICIAL -->
    <header class="header-hero" style="text-align: center;">
      <div class="badge-top" style="margin-bottom: 12px;">
        <span aria-hidden="true">🏫</span>
        <span>MEDUCA • Panamá</span>
        <span aria-hidden="true">•</span>
        <span>Agricultura</span>
      </div>
      <h1>Evaluaciones de Agricultura</h1>
    </header>

    <!-- ACCESO EXCLUSIVO CON GMAIL -->
    <section class="card start-access-card" id="homeTeacherAuthCard" aria-label="Acceso con Gmail" style="padding: 36px 24px;">
      <div id="homeAuthError" style="display: none; color: #b91c1c; background: #fee2e2; border: 1px solid #fca5a5; border-radius: 10px; padding: 10px 12px; font-weight: 700; font-size: 0.88rem; margin-bottom: 16px; text-align: left;"></div>

      <div style="display: flex; flex-direction: column; gap: 12px; align-items: center;">
        <button type="button" id="homeGoogleSignInBtn" class="btn-primary" style="max-width: 340px; padding: 15px 24px; font-size: 1.05rem; background: #1e3a8a; display: inline-flex; align-items: center; justify-content: center; gap: 12px;">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="background: #ffffff; border-radius: 50%; padding: 3px; flex-shrink: 0;">
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          </svg>
          <span id="homeGoogleSignInText">Iniciar sesión con Gmail</span>
        </button>

        <a href="./docente.html" id="homeOpenDocenteLink" class="btn-primary" style="display: none; max-width: 340px; padding: 15px 24px; font-size: 1.05rem; background: #15803d; justify-content: center;">
          Entrar a Grados
        </a>

        <button type="button" id="homeSwitchAccountBtn" class="btn-secondary" style="display: none; font-size: 0.9rem;">
          Cerrar sesión actual
        </button>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer-info">
      <div>Ministerio de Educación (MEDUCA) • Panamá</div>
    </footer>
  </main>

  <script src="./js/vendor/firebase-app-compat.js"></script>
  <script src="./js/vendor/firebase-auth-compat.js"></script>
  <script src="./js/vendor/firebase-firestore-compat.js"></script>
  <script src="./js/firebase-config.js"></script>
  <script>
    (function () {
      const signBtn = document.getElementById('homeGoogleSignInBtn');
      const signText = document.getElementById('homeGoogleSignInText');
      const openDocLink = document.getElementById('homeOpenDocenteLink');
      const logoutBtn = document.getElementById('homeSwitchAccountBtn');
      const authErr = document.getElementById('homeAuthError');

      function updateHomeButtons(isAuthed) {
        if (signBtn) signBtn.style.display = isAuthed ? 'none' : 'inline-flex';
        if (openDocLink) openDocLink.style.display = isAuthed ? 'inline-flex' : 'none';
        if (logoutBtn) logoutBtn.style.display = isAuthed ? 'inline-flex' : 'none';
      }

      if (window.MEDUCA_FIREBASE && window.MEDUCA_FIREBASE.onAuthStateChanged) {
        window.MEDUCA_FIREBASE.onAuthStateChanged(({ user, unauthorizedEmail }) => {
          if (unauthorizedEmail && authErr) {
            authErr.textContent = `Cuenta no autorizada (${unauthorizedEmail}). Usa civanp004@gmail.com.`;
            authErr.style.display = 'block';
          }
          if (user) {
            if (authErr) authErr.style.display = 'none';
            updateHomeButtons(true);
          } else {
            updateHomeButtons(false);
          }
        });
      }

      if (signBtn) {
        signBtn.addEventListener('click', async () => {
          if (!window.MEDUCA_FIREBASE || !window.MEDUCA_FIREBASE.signInWithGoogle) {
            window.location.href = './docente.html';
            return;
          }
          if (authErr) authErr.style.display = 'none';
          signBtn.disabled = true;
          if (signText) signText.textContent = 'Conectando...';
          const res = await window.MEDUCA_FIREBASE.signInWithGoogle();
          signBtn.disabled = false;
          if (signText) signText.textContent = 'Iniciar sesión con Gmail';
          if (res.ok) {
            window.location.href = './docente.html';
          } else if (authErr) {
            authErr.textContent = res.message || 'No se pudo iniciar sesión con Gmail.';
            authErr.style.display = 'block';
          }
        });
      }

      if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
          sessionStorage.removeItem('meduca_docente_auth');
          if (window.MEDUCA_FIREBASE && window.MEDUCA_FIREBASE.signOut) {
            await window.MEDUCA_FIREBASE.signOut();
          }
          if (authErr) authErr.style.display = 'none';
          updateHomeButtons(false);
        });
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('SW registrado:', reg.scope))
            .catch((err) => console.warn('SW err:', err));
        });
      }
    })();
  </script>
</body>
</html>
